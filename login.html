<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Css Style -->
    <link rel="stylesheet" href="css/style.css">
    <title>login</title>
</head>
<body>
    <header>
        <h1><a href="index.html">Online Shopping</a></h1>
        <ul class="login-logout">
            <li class="login js-login"><a href="login.html">Login</a> </li>
            <li class="register js-register"><a href="register.html">Register</a></li>
        </ul>
    </header>

    <!-- LogIn -->
    <section>
        <div class="section-form">
            <h2>Log In</h2>
            <form action="">

                <div class="user-email">
                    <label for="">Email</label>
                    <input type="email" title="Write Your email" id="js-user-email">
                </div>

                <P>You don't have an account <a href="register.html">Sign In</a></P>
                <div class="user-password">
                    <label for="">Password</label>
                    <input type="password" title="Write Your Password" id="js-user-password">
                </div>

                <div>
                    <input type="checkbox" title="Remember Me"> Remember Me
                </div>

                <div>
                    <input type="submit" id="js-login">
                </div>
            </form>
        </div>
    </section>

    <!-- <script src="js/register.js"></script> -->
    <script src="js/login.js"></script>
    <!-- <script src="js/script.js"></script> -->
</body>
</html>
